<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="웨딩툰과 유튜브로 찾아보는 듬아의 웨딩사전">
<title>듬아의 웨딩사전</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<svg class="source-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="source-instagram" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="17.5" cy="6.75" r="1.25" fill="currentColor"/>
  </symbol>
  <symbol id="source-youtube" viewBox="0 0 24 24">
    <path fill="currentColor" fill-rule="evenodd" d="M21.6 7.2a2.6 2.6 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4a2.6 2.6 0 0 0-1.8 1.8C2 8.8 2 12 2 12s0 3.2.4 4.8a2.6 2.6 0 0 0 1.8 1.8c1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4a2.6 2.6 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8ZM10 15l5.2-3-5.2-3v6Z"/>
  </symbol>
  <symbol id="source-shorts" viewBox="0 0 24 24">
    <path fill="currentColor" fill-rule="evenodd" d="M16.65 1.62a4.38 4.38 0 0 1 2.25 8.13l-.67.4a4.38 4.38 0 0 1-.08 7.49l-7.72 4.59a4.38 4.38 0 0 1-4.48-7.53l.66-.39a4.38 4.38 0 0 1 .08-7.49l7.72-4.59a4.37 4.37 0 0 1 2.24-.61ZM10 15.5l5.3-3.5L10 8.5v7Z"/>
  </symbol>
</svg>
<header><a class="brand" href="./"><span aria-hidden="true">✦</span> 듬아의 웨딩사전</a><a href="#catalog">카테고리 <span aria-hidden="true">↗</span></a></header>
<main>
<section class="hero" aria-labelledby="headline">
<div class="orbit" aria-hidden="true">✧</div>
<p class="eyebrow">DumA WEDDING DICTIONARY</p>
<h1 id="headline">결혼 준비하다<br><em>궁금한 게 생겼다면?</em></h1>
<form role="search" id="search-form">
<label class="sr-only" for="search">웨딩 콘텐츠 검색</label>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
<input id="search" type="search" placeholder="드레스, 헤어변형, 신혼여행…" autocomplete="off">
<button type="submit">검색</button>
</form>
</section>
<section class="catalog" id="catalog" aria-label="웨딩 콘텐츠">
<div class="section-heading"><p id="total"></p><p id="updated"></p></div>
<div class="filters">
<div class="category-slider">
<button class="category-arrow" type="button" id="categories-prev" aria-label="이전 카테고리" aria-controls="categories" disabled>‹</button>
<div class="categories" role="group" aria-label="카테고리" id="categories"></div>
<button class="category-arrow" type="button" id="categories-next" aria-label="다음 카테고리" aria-controls="categories" disabled>›</button>
</div>
<div class="platform-filter">
<label for="platform">플랫폼</label>
<select id="platform"></select>
</div>
</div>
<p id="status" role="status"></p>
<div id="results" class="grid"></div>
<noscript>콘텐츠를 검색하려면 자바스크립트를 켜 주세요.</noscript>
</section>
</main>
<footer><div class="brand"><span aria-hidden="true">✦</span> 듬아의 웨딩사전</div><div><a href="https://www.instagram.com/duma.toon/">인스타그램 ↗</a><a href="https://www.youtube.com/@듬아">유튜브 ↗</a></div></footer>
</body>
</html>
